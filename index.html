<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>輔仁大學產業實習平台 — 系統畫面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1;
    --surface:#FFFFFF;
    --surface-2:#FBF9F6;
    --ink:#221C1A;
    --ink-soft:#6B615C;
    --ink-faint:#9C938C;
    --line:#E6E0D8;
    --primary:#6B1E2E;
    --primary-soft:#8C3347;
    --primary-bg:#F3E5E8;
    --gold:#B98B2A;
    --gold-bg:#FAF1DE;
    --success:#3F7D5C;
    --success-bg:#E7F1EC;
    --warn:#B8722A;
    --warn-bg:#FBEEE0;
    --alert:#A23B3B;
    --alert-bg:#F7E7E5;
    --track-actual:#2E5C8A;
    --track-actual-bg:#E7EEF5;
    --track-enroll:#7A4FA0;
    --track-enroll-bg:#EFE7F5;
    --radius:10px;
    --shadow: 0 1px 2px rgba(34,28,26,0.04), 0 4px 16px rgba(34,28,26,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Noto Serif TC', serif;}

  .app{
    display:grid;
    grid-template-columns: 250px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:linear-gradient(180deg, var(--primary) 0%, #551725 100%);
    color:#F3E9EA;
    padding:22px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:2px 6px 14px;
    border-bottom:1px solid rgba(255,255,255,0.14);
  }
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC',serif;font-weight:900;color:var(--primary);
    font-size:16px;flex-shrink:0;
  }
  .brand .name{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:14.5px;
    line-height:1.4;
  }
  .brand .sub{
    font-size:10.5px;
    color:rgba(255,255,255,0.6);
    letter-spacing:0.03em;
  }

  .role-block{
    display:flex;flex-direction:column;gap:4px;
  }
  .role-label{
    font-size:10.5px;
    color:rgba(255,255,255,0.5);
    letter-spacing:0.08em;
    padding:0 8px 4px;
  }
  .role-btn{
    all:unset;
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    color:rgba(255,255,255,0.72);
    transition:background .15s ease, color .15s ease;
  }
  .role-btn .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);flex-shrink:0;}
  .role-btn:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .role-btn.active{background:rgba(255,255,255,0.16); color:#fff; font-weight:500;}
  .role-btn.active .dot{background:var(--gold);}

  .nav-block{
    display:flex;flex-direction:column;gap:2px;
    padding-top:6px;
    border-top:1px solid rgba(255,255,255,0.14);
  }
  .nav-item{
    all:unset;
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    color:rgba(255,255,255,0.85);
    display:flex; align-items:center; gap:8px;
    transition:background .15s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08);}
  .nav-item.active{background:#fff; color:var(--primary); font-weight:700;}

  .sidebar-foot{
    margin-top:auto;
    font-size:10.5px;
    color:rgba(255,255,255,0.4);
    padding:10px 8px 0;
    border-top:1px solid rgba(255,255,255,0.14);
    line-height:1.6;
  }

  /* ---------- Main ---------- */
  .main{
    display:flex;flex-direction:column;
    min-width:0;
  }
  .topbar{
    height:60px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;
    flex-shrink:0;
  }
  .crumbs{font-size:12px;color:var(--ink-faint);}
  .crumbs b{color:var(--ink);font-weight:700;}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  .bell{
    position:relative; cursor:pointer;
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
    border:1px solid var(--line);
  }
  .bell .badge{
    position:absolute;top:-3px;right:-3px;
    background:var(--alert);color:#fff;
    font-size:9px;font-weight:700;
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--primary-bg); color:var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .user-chip .who{font-size:12px;line-height:1.35;}
  .user-chip .who .n{font-weight:700;}
  .user-chip .who .r{color:var(--ink-faint);}

  .content{
    padding:26px 30px 60px;
    flex:1;
    overflow-y:auto;
  }
  .page-head{margin-bottom:20px;}
  .page-head h1{
    font-family:'Noto Serif TC',serif;
    font-size:22px;font-weight:700;margin:0 0 4px;
  }
  .page-head p{margin:0;color:var(--ink-soft);font-size:13px;}

  /* ---------- shared bits ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .grid{display:grid;gap:16px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:1.4fr 1fr;}

  .stat{
    padding:18px 18px 16px;
  }
  .stat .lbl{font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;}
  .stat .val{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;}
  .stat .delta{font-size:11px;margin-top:6px;color:var(--ink-faint);}
  .stat .delta.up{color:var(--success);}
  .stat .delta.warn{color:var(--warn);}

  .section-title{
    font-size:13.5px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .section-title .hint{font-size:11px;color:var(--ink-faint);font-weight:400;}

  .list-row{
    display:flex;align-items:center;gap:12px;
    padding:13px 18px;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .icon{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .list-row .body{flex:1;min-width:0;}
  .list-row .title{font-weight:700;margin-bottom:2px;}
  .list-row .sub{color:var(--ink-faint);font-size:11.5px;}

  .tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 9px;border-radius:100px;
    font-size:11px;font-weight:700;
    white-space:nowrap;
  }
  .tag.ok{background:var(--success-bg);color:var(--success);}
  .tag.warn{background:var(--warn-bg);color:var(--warn);}
  .tag.alert{background:var(--alert-bg);color:var(--alert);}
  .tag.gold{background:var(--gold-bg);color:var(--gold);}
  .tag.neutral{background:var(--surface-2);color:var(--ink-soft); border:1px solid var(--line);}

  /* dual-track time pill — signature component */
  .dualtrack{display:flex;gap:6px;flex-wrap:wrap;}
  .track{
    display:flex;align-items:center;gap:6px;
    padding:4px 10px 4px 4px;
    border-radius:100px;
    font-size:11px;
  }
  .track .ic{
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;flex-shrink:0;
  }
  .track.actual{background:var(--track-actual-bg);color:var(--track-actual);}
  .track.actual .ic{background:var(--track-actual);color:#fff;}
  .track.enroll{background:var(--track-enroll-bg);color:var(--track-enroll);}
  .track.enroll .ic{background:var(--track-enroll);color:#fff;}
  .track b{font-family:'IBM Plex Mono',monospace;font-weight:500;}

  .btn{
    all:unset;cursor:pointer;
    padding:9px 16px;border-radius:8px;
    font-size:12.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn.primary{background:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-soft);}
  .btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
  .btn.ghost:hover{border-color:var(--primary);color:var(--primary);}
  .btn.gold{background:var(--gold);color:#fff;}
  .btn.sm{padding:6px 12px;font-size:11.5px;}
  .btn.danger-ghost{background:var(--surface);border:1px solid var(--alert);color:var(--alert);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;font-size:11px;color:var(--ink-faint);font-weight:700;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .field .req{color:var(--alert);}
  .field input, .field select, .field textarea{
    font-family:inherit;font-size:12.5px;
    padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--ink);
  }
  .field .help{font-size:10.5px;color:var(--ink-faint);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .banner{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 16px;border-radius:10px;font-size:12px;line-height:1.6;
  }
  .banner.info{background:var(--track-actual-bg);color:#2A4A67;}
  .banner.gold{background:var(--gold-bg);color:#7A5A19;}
  .banner.warn{background:var(--warn-bg);color:#8A4E1A;}
  .banner .ic{font-size:15px;}

  .progress-track{
    display:flex;align-items:center;gap:0;
  }
  .pstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
  .pstep .circle{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    background:var(--surface-2);border:2px solid var(--line);color:var(--ink-faint);
    z-index:1;
  }
  .pstep.done .circle{background:var(--success);border-color:var(--success);color:#fff;}
  .pstep.current .circle{background:var(--primary);border-color:var(--primary);color:#fff;}
  .pstep .lbl{font-size:10.5px;text-align:center;color:var(--ink-faint);}
  .pstep.done .lbl, .pstep.current .lbl{color:var(--ink);font-weight:700;}
  .pline{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .pstep.done .pline{background:var(--success);}
  .pstep:first-child .pline{display:none;}

  .rating{display:flex;gap:3px;}
  .rating .st{width:15px;height:15px;color:var(--gold);}

  .empty-hint{padding:30px;text-align:center;color:var(--ink-faint);font-size:12px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .todo-item:last-child{border-bottom:none;}
  .todo-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);}
  .todo-item .due{margin-left:auto;font-size:11px;color:var(--ink-faint);}
  .todo-item .due.soon{color:var(--warn);font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">輔</div>
      <div>
        <div class="name">產業實習管理平台</div>
        <div class="sub">FJU INTERNSHIP SYSTEM</div>
      </div>
    </div>

    <div class="role-block">
      <div class="role-label">切換身分視角（原型示範用）</div>
      <button class="role-btn" data-role="secretary"><span class="dot"></span>系所秘書／實習助教</button>
      <button class="role-btn" data-role="advisor"><span class="dot"></span>實習輔導教師</button>
      <button class="role-btn" data-role="director"><span class="dot"></span>系主管</button>
      <button class="role-btn" data-role="student"><span class="dot"></span>學生</button>
      <button class="role-btn" data-role="admin"><span class="dot"></span>校級管理者</button>
    </div>

    <div class="nav-block" id="navBlock"></div>

    <div class="sidebar-foot">
      系統規劃大綱 v2 對應原型<br>
      僅供畫面走查，非最終視覺定案
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs">資訊管理學系 &nbsp;/&nbsp; <b>待辦總覽</b></div>
      <div class="topbar-right">
        <div class="bell" onclick="showScreen('notifications')"><span>🔔</span><span class="badge">4</span></div>
        <div class="user-chip">
          <div class="avatar" id="avatarInit">王</div>
          <div class="who"><div class="n" id="userName">王淑芬</div><div class="r" id="userRole">資訊管理學系・系辦實習助教</div></div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const NAV = {
  secretary: {
    label:'系所秘書／實習助教', avatar:'王', name:'王淑芬', roleText:'資訊管理學系・系辦實習助教', dept:'資訊管理學系',
    items:[
      {id:'sec_dashboard', label:'待辦總覽'},
      {id:'sec_institutions', label:'機構管理'},
      {id:'sec_form', label:'新增機構資料'},
      {id:'sec_case_detail', label:'案件狀態追蹤'},
      {id:'sec_contract', label:'合約簽訂'},
      {id:'sec_records', label:'各項紀錄上傳'},
      {id:'sec_docs', label:'常用文件上傳'},
    ]
  },
  advisor:{
    label:'實習輔導教師', avatar:'林', name:'林志明 教授', roleText:'企業管理學系・實習輔導教師', dept:'企業管理學系',
    items:[
      {id:'adv_review', label:'機構查核'},
      {id:'adv_visits', label:'訪視紀錄'},
    ]
  },
  director:{
    label:'系主管', avatar:'陳', name:'陳美玲 主任', roleText:'社會工作學系・系主任', dept:'社會工作學系',
    items:[
      {id:'dir_review', label:'機構審核'},
    ]
  },
  student:{
    label:'學生', avatar:'李', name:'李冠廷', roleText:'資訊管理學系四年級', dept:'資訊管理學系',
    items:[
      {id:'stu_journey', label:'我的實習歷程'},
      {id:'stu_uploads', label:'計畫書／心得上傳'},
      {id:'stu_survey', label:'滿意度調查'},
      {id:'stu_docs', label:'常用文件下載'},
    ]
  },
  admin:{
    label:'校級管理者', avatar:'教', name:'教務處實習業務', roleText:'教務處・跨系彙總管理', dept:'全校',
    items:[
      {id:'adm_docsearch', label:'跨系所文件查詢'},
      {id:'adm_reports', label:'統計報表匯出'},
      {id:'adm_regs', label:'法規版本管理'},
      {id:'adm_committee', label:'委員會治理報表'},
    ]
  }
};

let currentRole='secretary';
let currentScreen='sec_dashboard';

function initSidebar(){
  document.querySelectorAll('.role-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentRole = btn.dataset.role;
      currentScreen = NAV[currentRole].items[0].id;
      render();
    });
  });
}

function renderNav(){
  const nav = NAV[currentRole];
  const el = document.getElementById('navBlock');
  el.innerHTML = '<div class="role-label" style="padding-top:2px">'+nav.label+' 功能選單</div>' +
    nav.items.map(it=>`<button class="nav-item ${it.id===currentScreen?'active':''}" data-id="${it.id}">${it.label}</button>`).join('');
  el.querySelectorAll('.nav-item').forEach(b=>{
    b.addEventListener('click', ()=>{ currentScreen=b.dataset.id; render(); });
  });
}

function updateChrome(){
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active', b.dataset.role===currentRole));
  const nav = NAV[currentRole];
  document.getElementById('avatarInit').textContent = nav.avatar;
  document.getElementById('userName').textContent = nav.name;
  document.getElementById('userRole').textContent = nav.roleText;
  const screenLabel = (nav.items.find(i=>i.id===currentScreen)||{}).label || '通知提醒中心';
  document.getElementById('crumbs').innerHTML = nav.dept + ' &nbsp;/&nbsp; <b>' + screenLabel + '</b>';
}

function showScreen(id){ currentScreen=id; render(); }

function checkOrgMatch(){
  const taxId = document.getElementById('orgTaxIdInput');
  const banner = document.getElementById('orgMatchBanner');
  if(!taxId || !banner) return;
  // Demo logic: show match banner only when the 8-digit tax ID is complete
  banner.style.display = (taxId.value.trim().length === 8) ? 'flex' : 'none';
}

function dual(actual, enroll){
  return `<div class="dualtrack">
    <div class="track actual"><span class="ic">實</span>實際期間 <b>${actual}</b></div>
    <div class="track enroll"><span class="ic">選</span>認列學年期 <b>${enroll}</b></div>
  </div>`;
}

/* ---------------- SCREENS ---------------- */

function screen_sec_dashboard(){
  return `
  <div class="page-head">
    <h1>早安，王淑芬 — 資訊管理學系</h1>
    <p>以下是本系所今日待處理事項與整體實習概況</p>
  </div>
  <div class="grid g4" style="margin-bottom:18px;">
    <div class="card stat"><div class="lbl">本學年度實習學生數</div><div class="val mono">86</div><div class="delta up">▲ 較去年同期 +12</div></div>
    <div class="card stat"><div class="lbl">合作機構數（有效）</div><div class="val mono">41</div><div class="delta">3 家評核即將到期</div></div>
    <div class="card stat"><div class="lbl">待審核機構申請</div><div class="val mono">5</div><div class="delta warn">2 件已逾 3 個工作天</div></div>
    <div class="card stat"><div class="lbl">本月待完成訪視</div><div class="val mono">9</div><div class="delta warn">4 筆將於 7 日內到期</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="section-title">待辦事項 <span class="hint">依到期日排序</span></div>
      <div class="todo-item"><input type="checkbox"><span>審核「台灣星辰資訊」機構評估表，待送系主任核定</span><span class="due soon">今天到期</span></div>
      <div class="todo-item"><input type="checkbox"><span>上傳「雲創數位」實習合約掃描檔</span><span class="due soon">明天到期</span></div>
      <div class="todo-item"><input type="checkbox"><span>「大成物流」機構評核效期即將於 9/02 到期，需重新查核</span><span class="due">14 天後</span></div>
      <div class="todo-item"><input type="checkbox"><span>提醒 6 位學生填寫實習滿意度調查</span><span class="due">開放中</span></div>
      <div class="todo-item"><input type="checkbox"><span>確認暑期實習學生的選課認列學年期是否已對應完成</span><span class="due">開放中</span></div>
    </div>

    <div class="card">
      <div class="section-title">系統公告</div>

function calcWage(p){
  const [s,e] = p.period.split('–');
  const start = new Date(s.replace(/\//g,'-'));
  const end = new Date(e.replace(/\//g,'-'));
  let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth());
  if(end.getDate() >= start.getDate()) months += 1;
  let wage;
  if(p.payType === '時薪') wage = (p.payAmount * p.hours) / months;
  else if(p.payType === '月薪') wage = p.payAmount;
  else if(p.payType === '一次性給付') wage = p.payAmount / months;
  else wage = 0;
  return { months, wage: Math.round(wage) };
}
